server:
  forward-headers-strategy: native

spring:
  application:
    name: auclairdeso-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auclairdeso}
    username: ${DB_USERNAME:auclairdeso}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  session:
    timeout: 1h
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health, info

auclairdeso:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail-from: "${MAIL_FROM:Au clair de So <no-reply@auclairdeso.local>}"
