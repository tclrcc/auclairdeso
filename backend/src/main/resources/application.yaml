server:
  forward-headers-strategy: native

spring:
  application:
    name: auclairdeso-backend
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auclairdeso}
    username: ${DB_USERNAME:auclairdeso}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

  modulith:
    events:
      completion-mode: delete
      republish-outstanding-events-on-restart: true

  session:
    timeout: 1h
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health, info

auclairdeso:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  mail-from: "${MAIL_FROM:Au clair de So <no-reply@auclairdeso.local>}"
  # Printed on every bill (docs/specification.md, 10). The real values go into deploy/.env, never into Git.
  billing:
    zone: ${auclairdeso.booking.zone:Europe/Paris}
    practitioner-name: "${BILLING_PRACTITIONER_NAME:Nom de la praticienne EI}"
    address: "${BILLING_ADDRESS:Adresse professionnelle à configurer}"
    siret: "${BILLING_SIRET:SIRET à configurer}"
  # Shown on the legal pages (10). The identity is the one of the bills: a single place to fill in.
  legal:
    publisher-name: ${auclairdeso.billing.practitioner-name}
    address: ${auclairdeso.billing.address}
    siret: ${auclairdeso.billing.siret}
    contact-email: "${LEGAL_CONTACT_EMAIL:contact@auclairdeso.local}"
    host: "${LEGAL_HOST:OVH SAS, 2 rue Kellermann, 59100 Roubaix, France — ovhcloud.com}"
    mediator-name: "${LEGAL_MEDIATOR_NAME:}"
    mediator-url: "${LEGAL_MEDIATOR_URL:}"
