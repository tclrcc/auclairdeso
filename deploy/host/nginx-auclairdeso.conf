# Au clair de So, acceptance environment, published on the Internet by the nginx of the VPS.
# Same certificate as the site on port 443: a certificate names a host, not a port.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name vps-5ff241d3.vps.ovh.net;

    ssl_certificate     /etc/letsencrypt/live/vps-5ff241d3.vps.ovh.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-5ff241d3.vps.ovh.net/privkey.pem;

    # Not open to the public yet: a shared password, and no search engine indexing.
    auth_basic           "Au clair de So";
    auth_basic_user_file /etc/nginx/auclairdeso.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Booking requests carry a photo (12 MB at most, as in the gateway).
    client_max_body_size 12m;

    # "http://" typed on this HTTPS port: send the visitor to the right address.
    error_page 497 =301 https://$host:$server_port$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The password is checked here: the application never receives it.
        proxy_set_header Authorization "";
    }
}
