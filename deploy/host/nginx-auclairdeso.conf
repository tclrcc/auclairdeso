# Au clair de So, acceptance environment, published on the Internet by the nginx of the VPS.
# Same certificate as the site on port 443: a certificate names a host, not a port.
#
# Access: the password is asked once, at /recette/acces, which then leaves a cookie for 90 days.
# HTTP Basic authentication on the whole site does not work with this application: the browser
# forgets the password each time the application answers 401 (anonymous visitor), and asks again.

# The secret value of that cookie, generated on the VPS from nginx-auclairdeso-secret.conf.example.
include /etc/nginx/auclairdeso-recette.conf;

# Where to go once through the door: the page first asked for, if it is a path of this site.
map $cookie_auclairdeso_next $auclairdeso_next {
    "~^/([A-Za-z0-9?]|$)" $cookie_auclairdeso_next;
    default               /;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name vps-5ff241d3.vps.ovh.net;

    ssl_certificate     /etc/letsencrypt/live/vps-5ff241d3.vps.ovh.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-5ff241d3.vps.ovh.net/privkey.pem;

    # Not open to the public yet: no search engine indexing.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Booking requests carry a photo (12 MB at most, as in the gateway).
    client_max_body_size 12m;

    # "http://" typed on this HTTPS port: send the visitor to the right address.
    error_page 497 =301 https://$host:$server_port$request_uri;

    # The door. In its own folder, so that the browser never sends the password to the application.
    location = /recette/acces {
        auth_basic           "Au clair de So";
        auth_basic_user_file /etc/nginx/auclairdeso.htpasswd;
        # try_files runs after the password check, whereas a "return" here would run before it.
        try_files /recette-acces-absent @recette_open;
    }

    location @recette_open {
        add_header Set-Cookie "auclairdeso_access=$auclairdeso_key; Path=/; Max-Age=7776000; Secure; HttpOnly; SameSite=Lax" always;
        add_header Set-Cookie "auclairdeso_next=; Path=/recette/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 $auclairdeso_next;
    }

    location / {
        # Without the cookie: remember the page asked for, then go through the door.
        if ($auclairdeso_open = 0) {
            add_header Set-Cookie "auclairdeso_next=$request_uri; Path=/recette/; Max-Age=600; Secure; HttpOnly; SameSite=Lax" always;
            add_header Cache-Control "no-store" always;
            return 302 /recette/acces;
        }

        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }
}
