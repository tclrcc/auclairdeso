# Single entry point: the browser sees one origin, as with the ng serve proxy in development.

# Behind the nginx of the VPS (public HTTPS access), keep the protocol it received.
# Through the SSH tunnel there is no such header: the protocol is this one.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Requests for a magic link, per client address: 3 a minute, with a burst of 3 (limit_req below).
# The backend adds its own limits, per client, per email address and in total (identity module).
limit_req_zone $binary_remote_addr zone=magic_link:1m rate=3r/m;
# Password attempts of the staff, per client address: 5 a minute, with a burst of 5.
limit_req_zone $binary_remote_addr zone=password:1m rate=5r/m;

server {
    listen 80;
    server_name _;

    # No nginx version in the responses.
    server_tokens off;

    # Booking requests carry a photo (spring.servlet.multipart.max-request-size is 12MB).
    client_max_body_size 12m;

    # The real client address. Every connection reaches this gateway from the Docker bridge, so
    # $remote_addr would be the same for all visitors. The nginx of the VPS appends the address of
    # the connection it received to X-Forwarded-For: take the last address of that list that is not
    # a private one. What a visitor writes in X-Forwarded-For stays on the left and is never used.
    # Through the SSH tunnel, nothing rewrites the header: that access is for the developer only.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        # The client address decided above, alone: the backend limits per client on it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Inherits the headers above; proxy_pass is not inherited and is repeated.
        location = /api/auth/magic-link {
            limit_req zone=magic_link burst=3 nodelay;
            proxy_pass http://backend:8080;
        }

        location = /api/auth/password {
            limit_req zone=password burst=5 nodelay;
            proxy_pass http://backend:8080;
        }
    }

    # Videos and images of the vitrine (deploy/.env, MEDIA_DIR): dropped on the VPS, never committed.
    # nginx serves them itself, which gives the Range requests a <video> needs to seek in the file.
    #
    # "/contenus" and not "/media": the Angular build already publishes its fonts under /media/.
    # "root" and not "alias": behind an alias, try_files looks for the file under the root anyway
    # and everything answers 404. The folder of the VPS is mounted at /srv/contenus (compose.yaml).
    location /contenus/ {
        root /srv;
        try_files $uri =404;
        # One hour: replacing a file on the VPS is visible the same day, without renaming it.
        expires 1h;
        access_log off;
    }

    # The rendering server trusts X-Forwarded-Proto only (frontend/src/server.ts): it needs neither the
    # client address nor any other forwarded header. $http_host keeps the port, as for /api/.
    location / {
        proxy_pass http://frontend:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
