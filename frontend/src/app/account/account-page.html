<main class="min-h-dvh bg-sand px-6 py-16 text-night">
  <div class="mx-auto max-w-xl">
    <h1 class="font-display text-4xl tracking-tight">Mon espace</h1>
    <p class="mt-4">Connecté avec <strong>{{ auth.currentUser()?.email }}</strong>.</p>
    <p class="mt-2 text-night/70">Vos rendez-vous apparaîtront ici.</p>

    <div class="mt-10 flex flex-wrap gap-4">
      @if (auth.isStaff()) {
      <a routerLink="/admin" class="btn-primary">Administration</a>
      }
      <button type="button" class="btn-primary" (click)="logout()">Se déconnecter</button>
    </div>
  </div>
</main>
