<header class="night-container relative z-10 flex flex-wrap items-center gap-x-8 py-4 md:flex-nowrap">
  <a routerLink="/" class="mr-auto flex items-center gap-3 rounded-full">
    <!-- The logo is a dark disc: a fine gold ring keeps it apart from the night of the page. -->
    <img src="logo.webp" alt="" width="48" height="48" class="size-12 rounded-full ring-1 ring-gold/45" />
    <span class="site-name sr-only sm:not-sr-only">Au clair de So</span>
  </a>

  <button #menuButton type="button" class="menu-button" aria-controls="site-menu"
          [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
    <span class="sr-only">Menu</span>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="size-5" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h16" />
    </svg>
  </button>

  <!-- Shown from "md" on; below, unfolded by the button above. -->
  <nav id="site-menu" aria-label="Navigation principale" class="site-menu" [attr.data-open]="menuOpen()">
    <ul class="site-links">
      <li>
        <a routerLink="/seances" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="site-link">Séances et tarifs</a>
      </li>
      <li>
        <a routerLink="/a-propos" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="site-link">À propos</a>
      </li>
      <li>
        <a routerLink="/mon-espace" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="site-link">Mes rendez-vous</a>
      </li>
    </ul>

    <!-- A signed-in client reaches her account (and its logout) from here; staff members reach the administration. -->
    @if (auth.isStaff()) {
    <a routerLink="/admin" class="btn-gold-outline">Administration</a>
    } @else if (auth.isAuthenticated()) {
    <a routerLink="/mon-espace" fragment="compte" class="btn-gold-outline">Mon compte</a>
    } @else {
    <a routerLink="/connexion" class="btn-gold-outline">Se connecter</a>
    }
  </nav>
</header>
